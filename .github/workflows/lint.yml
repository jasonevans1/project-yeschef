name: linter

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Security regression check (dampener for the security control loop)
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          pr_count=$(composer audit --locked --format=json --no-interaction 2>/dev/null | jq '[.advisories[][]] | length')
          mkdir -p /tmp/base
          git show "origin/${{ github.base_ref }}:composer.json" > /tmp/base/composer.json
          git show "origin/${{ github.base_ref }}:composer.lock" > /tmp/base/composer.lock
          base_count=$(cd /tmp/base && composer audit --locked --format=json --no-interaction 2>/dev/null | jq '[.advisories[][]] | length')
          echo "base: $base_count advisories, PR: $pr_count advisories"
          if [ "$pr_count" -gt "$base_count" ]; then
            echo "::warning::This PR increases composer audit advisories ($base_count -> $pr_count). See .claude/control-loops/security.md"
          fi

